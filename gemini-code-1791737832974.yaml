name: Render Video

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install react react-dom remotion @remotion/cli typescript @types/react

      - name: Render Remotion Video
        run: |
          npx remotion render src/index.ts SubifyExplainer out/subify_explainer_1080p.mp4

      - name: Upload Video File
        uses: actions/upload-artifact@v4
        with:
          name: subify-explainer-mp4
          path: out/subify_explainer_1080p.mp4